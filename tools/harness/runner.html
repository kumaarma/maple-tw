<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>RWD 測試容器</title>
<style>
  html, body { margin: 0; background: #444; }
  iframe { border: 0; display: block; background: #10131a; }
  #diag {
    all: revert;
    background: #fff; color: #000;
    font: 11px/1.5 monospace;
    padding: 6px;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<!--
  用 iframe 把版面寬度鎖死。

  這一層不是多餘的：Chrome 的 --window-size 指定的是「外框」，實際
  版面寬度會比它大（實測給 390 會得到 485）。直接截圖只是把 485px
  的版面裁成 390px，看起來像是元素被切掉，會誤導成版面 bug。
  iframe 的寬度才是 CSS 看到的寬度，媒體查詢也照這個算。
-->
<iframe id="f"></iframe>
<pre id="diag">(等待中)</pre>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var width = Number(q.get('w') || 375);
  var height = Number(q.get('h') || 1400);

  /* hash 由這裡組，不要在外面拼好再塞進 p —— hash 裡的 & 會被
     URLSearchParams 當成參數分隔，測試模式的參數會整個掉不見。 */
  var page = q.get('p') + '#mode=' + (q.get('mode') || 'tabs');
  if (q.get('i') !== null) page += '&i=' + q.get('i');

  var f = document.getElementById('f');
  f.width = width;
  f.height = height;
  f.src = page;

  // 驅動是非同步的，載入完成不等於跑完，要輪詢
  var n = 0;
  var timer = setInterval(function () {
    n++;
    try {
      var d = f.contentDocument && f.contentDocument.getElementById('diag');
      if (d && d.textContent.trim()) {
        document.getElementById('diag').textContent = d.textContent;
        clearInterval(timer);
      } else if (n > 600) {
        document.getElementById('diag').textContent = '逾時：#diag 一直是空的';
        clearInterval(timer);
      }
    } catch (e) {
      document.getElementById('diag').textContent = '讀不到 iframe：' + e.message;
      clearInterval(timer);
    }
  }, 100);
}());
</script>
</body>
</html>
